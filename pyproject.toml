[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coil-servo"
version = "0.1.0"
description = "Reference model, simulation, and host tools for the Rb-Cs coil current servo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# the web dashboard (python -m coil_servo_host.dashboard, docs/dashboard.md)
dashboard = ["starlette>=0.37", "uvicorn>=0.29"]
# httpx: starlette's test client, for the dashboard tests
dev = ["pytest>=7", "cocotb>=2.0", "matplotlib",
       "starlette>=0.37", "uvicorn>=0.29", "httpx"]

[tool.setuptools.packages.find]
where = ["model", "host"]

[tool.setuptools.package-data]
"coil_servo_host.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["model/tests", "sim", "host/tests"]
