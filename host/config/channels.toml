# Per-channel configuration for the coil servo boards (MVP power stage,
# docs/mvp_architecture.md).
#
# This file is the ONE place for measured and provisional numbers. The host
# loader (host/coil_servo_host/config.py) builds the physics model from the
# "physics" block (overriding model/coil_servo_model/channels.py) and DERIVES
# the register values from it: the sensor scale I_FS, the OUT1 command
# clamp, and the dead-zone floor. So when a bench measurement arrives
# (thresholds, g_fs, termination, in-amp gain ...), change it here and the
# registers follow. Print what the loader derives with:
#
#     python -m coil_servo_host.config mot
#
# EVERY value marked PROVISIONAL is computed or assumed, not measured.
#
# board_host: address of the board on the WIRED Ethernet lab network (never
# WiFi -- latency and dropouts).
#
# UNITS -- two different "ticks" appear here, don't mix them up:
#   * zero_holdoff_ticks / trip_ticks count DECIMATED samples (1.024 us);
#   * *_us values are MICROSECONDS, converted to 8 ns fabric clock ticks.
# deadband_counts is in raw DAC counts (an OUT1 turn-on hysteresis).

[mot]
board_host = "192.168.0.65"     # first board, fixed IP on the wired lab net

# --- physics (overrides of model/coil_servo_model/channels.py) ---
I_rated = 100.0                 # amps
V_rail = 5.0                    # SE-600-5 (refused above 6 V on the MOT)
V_th = [3.52, 3.53, 3.52, 3.56, 3.50, 3.52]   # MEASURED 2026-11-02 (3 mA)
g_fs = 50.0                     # A/V per FET in this regime -- PROVISIONAL
gain_opamp = 7.98               # OPA994 stage, 1 + 6.98k/1k
out1_terminated = true          # OUT1 into 50 ohm -- PROVISIONAL (check 3.2)
R_burden = 10.0                 # ohm, LEM burden
G_inamp = 1.0                   # AD8421 gain -- PROVISIONAL (1 -> I_FS 200 A)

# --- derived-value overrides (uncomment once measured directly) ---
# out_clamp_counts = 4474       # OUT1 command clamp (default: model, the
#                               # command that asks for I_rated)
# u_floor_counts = 3234         # RUN floor (default: floor_frac x dead zone)
floor_frac = 0.9                # floor at 90 % of the dead zone (decided)

# --- loop ---
# The commissioned loopback gains (kp 0.5, ki 15080/s) rescaled by the
# model's plant gain G_pass/I_FS ~ 4.79 -- PROVISIONAL: set them from the
# measured step response.
kp = 0.1044
ki = 3149.0                     # 1/s
deadband_counts = 8             # PROVISIONAL
dither_enable = 1               # OUT1 sigma-delta dither (decided)

# --- protection ---
trip_amps = 100.0               # over-current trip (decided: supply rating);
                                # hold setpoints a little below it (~98 A)
trip_ticks = 4                  # consecutive ~1 us samples above the level
trip_timeout_us = 3000.0        # bridge opens at the latest after this
                                # (freewheel from 100 A takes ~1.3 ms)
slew_up_amps_per_ms = 200.0     # setpoint ramp away from zero (decided)
slew_down_amps_per_ms = 50.0    # setpoint ramp toward zero (decided)

# --- flip / stop ---
zero_win_amps = 0.5             # flip zero window -- PROVISIONAL (calibrate
                                # the ~0.3 A IN1 offset first)
zero_holdoff_ticks = 64         # decimated samples (~66 us of quiet)
deadtime_us = 1.0               # PROVISIONAL
settle_us = 100.0               # chamber eddy PLACEHOLDER -- unmeasured
flip_timeout_us = 20000.0       # 20 ms then TIMEOUT_HOLD
dio_invert = 0                  # b0 flip, b1 arm, b2 fault

# --- not fitted in the MVP: must stay 0 ---
out2_enable = 0
out2_invert = 0
boost_mode = 0

# Low-current TEST PROFILE for the MOT channel (docs/bench_supply_test.md):
# the same board, coil and power stage, but powered from a current-limited
# BENCH SUPPLY (5 V, 3 A limit) in place of the SE-600-5, with the coil lead
# wound 10 times through the LEM. Use this name with every host tool
# (deploy/check/watch/step/sweep mot_bench) ONLY while the bench supply is
# connected and the LEM carries 10 turns -- with 1 turn every current
# reading is 10x too small. Everything here is PROVISIONAL unless marked.

[mot_bench]
board_host = "192.168.0.65"     # the MOT board (same board as [mot])

# --- physics (overrides of model/coil_servo_model/channels.py) ---
I_rated = 2.5                   # amps: highest closed-loop setpoint on the
                                # bench (refused at/above I_supply_max)
I_supply_max = 3.0              # bench supply CC (current-limit) setting --
                                # the real hard limit on the bench
V_rail = 5.0                    # bench supply CV (voltage) setting: same as
                                # the SE-600-5, so slew rates match
V_th = [3.52, 3.53, 3.52, 3.56, 3.50, 3.52]   # MEASURED 2026-11-02 (3 mA)
g_fs = 50.0                     # A/V per FET -- PROVISIONAL, and least
                                # accurate here: <= 0.5 A per FET is near
                                # threshold, where g_fs is lower
gain_opamp = 7.98               # OPA994 stage, 1 + 6.98k/1k
out1_terminated = true          # OUT1 into 50 ohm -- PROVISIONAL (check 3.2)
R_burden = 10.0                 # ohm, LEM burden
G_inamp = 1.0                   # AD8421 gain -- PROVISIONAL
lem_turns = 10                  # coil lead through the LEM 10x -> I_FS 20 A,
                                # 2.44 mA per ADC count -- PROVISIONAL: count
                                # the turns that really fit the aperture

# --- derived-value overrides ---
# Clamp set directly, NOT derived from I_rated: at 2.5 A the derived clamp
# (~3637 counts) sits only ~44 counts above the nominal dead zone (~3593),
# inside the dead-zone uncertainty, so it could block the first open-loop
# measurement. 4000 counts = 0.488 V at OUT1, ~3.9 V of gate (~0.4 V above
# threshold; the production clamp is 4474). On the bench the supply's CC
# limit, not the clamp, bounds the current. Re-set after measuring the
# dead zone and G_pass.
out_clamp_counts = 4000
# u_floor_counts = ...          # optional, after the dead zone is measured:
#                               # (measured dead zone - 50 counts) makes
#                               # steps from zero faster (bench_supply_test.md)
floor_frac = 0.9                # floor at 90 % of the dead zone (decided)

# --- loop ---
# analysis.suggest_gains on this profile: the commissioned gains rescaled by
# the model's plant gain G_pass/I_FS ~ 47.9 (10x the production value,
# because I_FS is 10x smaller) -- PROVISIONAL: set them from the measured
# step response. If the real G_pass near threshold is lower, these give a
# slower but still stable loop.
kp = 0.010443
ki = 314.95                     # 1/s
deadband_counts = 8             # PROVISIONAL
dither_enable = 1               # OUT1 dither: one OUT1 count is ~0.12 A,
                                # ~5 % of a 2.5 A hold -- essential here

# --- protection ---
trip_amps = 2.8                 # firmware trip: above every allowed setpoint
                                # (2.5 A) and below the supply limit (3.0 A),
                                # so the trip fires before the supply limits
trip_ticks = 4                  # consecutive ~1 us samples above the level
trip_timeout_us = 3000.0        # same as production; freewheel from 2.5 A
                                # takes only ~0.05-0.1 ms
slew_up_amps_per_ms = 200.0     # same physical rates as production: they
slew_down_amps_per_ms = 50.0    # are set by rail/L and V_f/L, not by the
                                # current scale

# --- flip / stop ---
zero_win_amps = 0.1             # flip zero window -- PROVISIONAL: 41 counts,
                                # ~3x the expected IN1 offset (~1.4 mV =
                                # ~28 mA at I_FS 20 A); calibrate first
zero_holdoff_ticks = 64         # decimated samples (~66 us of quiet)
deadtime_us = 1.0               # PROVISIONAL
settle_us = 100.0               # chamber eddy PLACEHOLDER -- unmeasured
flip_timeout_us = 20000.0       # 20 ms then TIMEOUT_HOLD
dio_invert = 0                  # b0 flip, b1 arm, b2 fault

# --- not fitted in the MVP: must stay 0 ---
out2_enable = 0
out2_invert = 0
boost_mode = 0

# The shim rows are PLACEHOLDERS: their power stages are not built (shim
# supply not chosen, rail <= 10 V). They reuse the MOT stage parts.

