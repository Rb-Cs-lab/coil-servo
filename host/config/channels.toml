# Per-channel configuration for the four coil servo boards.
#
# EVERY value marked PROVISIONAL is computed or assumed, not measured --
# see "Open unknowns" in BOOTSTRAP.md. Update here (never in code) as real
# measurements arrive. Physics values must stay consistent with
# model/coil_servo_model/channels.py.
#
# board_host: address of the board on the WIRED Ethernet lab network
# (the rp-xxxxxx.local name from the sticker on the Ethernet jack, or a
# static IP). The boards are never to be attached via WiFi -- latency and
# dropouts.
#
# UNITS -- two different "ticks" appear here, don't mix them up:
#   * zero_holdoff_ticks counts DECIMATED samples (1.024 us each);
#   * deadtime_us / settle_us / flip_timeout_us are given in MICROSECONDS
#     and converted to 8 ns fabric clock ticks by config.py.
# deadband_counts is in raw DAC counts (1 count = I_FS/8192 amps, i.e.
# ~15.3 mA on the MOT channel, ~9.2 mA on the shims) because it is a
# handoff hysteresis at the digital output, not a physical current limit.

[mot]
board_host = "192.168.0.65"     # first board, fixed IP on the wired lab net
I_rated = 100.0                 # amps
I_FS = 125.0                    # amps at +1.000 V on IN1 -- PROVISIONAL
                                # (fixed by the burden resistor choice)
kp = 0.5                        # normalized -- PROVISIONAL, from the model;
ki = 15080.0                    # 1/s        -- retune from measured step
deadband_counts = 8             # PROVISIONAL
zero_win_amps = 0.5             # flip zero window -- PROVISIONAL
zero_holdoff_ticks = 64         # decimated samples (~66 us of quiet;
                                # matches design.md section 3)
deadtime_us = 1.0               # PROVISIONAL
settle_us = 100.0               # chamber eddy PLACEHOLDER -- unmeasured
flip_timeout_us = 20000.0       # 20 ms then TIMEOUT_HOLD
dio_invert = 0                  # b0 flip, b1 arm, b2 fault
out2_invert = 0
boost_mode = 1                  # 1 = auto (FSM-driven)

[z_shim]
board_host = "rp-zshim.local"   # PLACEHOLDER
I_rated = 60.0
I_FS = 75.0                     # PROVISIONAL
kp = 0.5                        # PROVISIONAL
ki = 15080.0                    # PROVISIONAL
deadband_counts = 8
zero_win_amps = 0.3
zero_holdoff_ticks = 16
deadtime_us = 1.0
settle_us = 100.0
flip_timeout_us = 20000.0
dio_invert = 0
out2_invert = 0
boost_mode = 1

[x_shim]
board_host = "rp-xshim.local"   # PLACEHOLDER
I_rated = 60.0
I_FS = 75.0                     # PROVISIONAL
kp = 0.5                        # PROVISIONAL
ki = 15080.0                    # PROVISIONAL
deadband_counts = 8
zero_win_amps = 0.3
zero_holdoff_ticks = 16
deadtime_us = 1.0
settle_us = 100.0
flip_timeout_us = 20000.0
dio_invert = 0
out2_invert = 0
boost_mode = 1

[y_shim]
board_host = "rp-yshim.local"   # PLACEHOLDER
I_rated = 60.0
I_FS = 75.0                     # PROVISIONAL
kp = 0.5                        # PROVISIONAL
