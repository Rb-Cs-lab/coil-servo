g_fs = 50.0
gain_opamp = 7.98
out1_terminated = true
R_burden = 10.0
G_inamp = 1.0
floor_frac = 0.9
kp = 0.1044
ki = 3149.0
deadband_counts = 8
dither_enable = 1
trip_amps = 60.0
trip_ticks = 4
trip_timeout_us = 3000.0
slew_up_amps_per_ms = 200.0
