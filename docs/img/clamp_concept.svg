<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, sans-serif">
  <defs>
    <marker id="ca" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1F497D"/>
    </marker>
    <marker id="ck" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="400" fill="#FFFFFF"/>

  <!-- top node -->
  <path d="M60,60 H580" fill="none" stroke="#333333" stroke-width="3"/>
  <text x="320" y="46" font-size="12" text-anchor="middle" fill="#1F497D" font-weight="bold">bridge-input node (drive bus)</text>

  <!-- FET shunt leg -->
  <circle cx="300" cy="60" r="4" fill="#333333"/>
  <path d="M300,60 V110" fill="none" stroke="#333333" stroke-width="3"/>
  <path d="M318,78 V98" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ck)"/>
  <text x="326" y="92" font-size="10">I_clamp (sink)</text>
  <rect x="255" y="110" width="90" height="60" fill="#DDEBF7" stroke="#1F497D" stroke-width="1.5"/>
  <text x="300" y="135" font-size="12" text-anchor="middle" fill="#1F497D" font-weight="bold">N-FET bank</text>
  <text x="300" y="152" font-size="11" text-anchor="middle">(linear)</text>
  <path d="M300,170 V210" fill="none" stroke="#333333" stroke-width="3"/>
  <circle cx="300" cy="205" r="3" fill="#1F497D"/>
  <rect x="280" y="210" width="40" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="234" font-size="10" text-anchor="middle">R_sense</text>
  <path d="M300,250 V300" fill="none" stroke="#333333" stroke-width="3"/>

  <!-- error amp -->
  <polygon points="120,155 120,215 195,185" fill="#DDEBF7" stroke="#1F497D" stroke-width="1.5"/>
  <text x="130" y="176" font-size="12">+</text>
  <text x="130" y="207" font-size="12">−</text>
  <text x="150" y="146" font-size="11" fill="#1F497D">error amp</text>
  <!-- OUT2 command in -->
  <path d="M40,170 H116" fill="none" stroke="#1F497D" stroke-width="1.5" marker-end="url(#ca)"/>
  <text x="42" y="160" font-size="10" fill="#1F497D">OUT2 command (0…0.8 V)</text>
  <!-- feedback from sense node -->
  <path d="M300,205 H265 V260 H100 V200 H116" fill="none" stroke="#1F497D" stroke-width="1.5" marker-end="url(#ca)"/>
  <!-- amp output to gate -->
  <path d="M195,185 H220 V140 H251" fill="none" stroke="#1F497D" stroke-width="1.5" marker-end="url(#ca)"/>
  <text x="215" y="130" font-size="10" fill="#1F497D">gate</text>

  <!-- TVS leg -->
  <circle cx="500" cy="60" r="4" fill="#333333"/>
  <path d="M500,60 V130" fill="none" stroke="#333333" stroke-width="2"/>
  <rect x="465" y="130" width="70" height="80" fill="#FBE4E4" stroke="#C00000" stroke-width="1.5"/>
  <text x="500" y="160" font-size="12" text-anchor="middle" fill="#C00000" font-weight="bold">TVS</text>
  <text x="500" y="177" font-size="10" text-anchor="middle" fill="#C00000">passive</text>
  <text x="500" y="191" font-size="10" text-anchor="middle" fill="#C00000">backstop</text>
  <path d="M500,210 V300" fill="none" stroke="#333333" stroke-width="2"/>

  <!-- return -->
  <path d="M60,300 H580" fill="none" stroke="#333333" stroke-width="3"/>
  <path d="M430,300 V312 M418,312 H442 M423,318 H437 M428,324 H432" stroke="#333333" stroke-width="2" fill="none"/>
  <text x="452" y="316" font-size="10">return</text>

  <!-- notes -->
  <text x="60" y="348" font-size="10" fill="#555555">Mirror of the pass bank's error-amp + source-sense pattern, arranged as a shunt sink: OUT2 command → sink current (transconductance).</text>
  <text x="60" y="364" font-size="10" fill="#555555">Compliance = FET V_DS rating (~30 V, provisional) → ramp-down dI/dt ≈ V_clamp / L. Dissipates ½LI² per ramp-down (≈ 0.08 J at 100 A, MOT)</text>
  <text x="60" y="380" font-size="10" fill="#555555">plus regulation power. Design intent only — for review.</text>
</svg>
