<svg viewBox="0 0 1300 1010" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, sans-serif">
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1F497D"/>
    </marker>
    <marker id="ak" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="1010" fill="#FFFFFF"/>

  <!-- ===================== POWER LOOP ===================== -->
  <!-- supply -->
  <rect x="40" y="70" width="160" height="120" fill="#DDEBF7" stroke="#1F497D" stroke-width="1.5"/>
  <text x="120" y="98" font-size="13" text-anchor="middle" fill="#1F497D" font-weight="bold">Mean Well SE-600-5</text>
  <text x="120" y="118" font-size="12" text-anchor="middle">5 V, 100 A, fixed</text>
  <text x="120" y="136" font-size="11" text-anchor="middle">~150 mV p-p @ ~50 kHz</text>
  <text x="192" y="86" font-size="13" text-anchor="end" font-weight="bold">+</text>
  <text x="108" y="84" font-size="13" text-anchor="end" font-weight="bold">−</text>
  <!-- + to rail bar -->
  <path d="M200,90 H340" fill="none" stroke="#333333" stroke-width="4"/>
  <text x="265" y="82" font-size="11" text-anchor="middle">4/0 AWG</text>
  <!-- − return: from supply top, over the top, down to source bar -->
  <path d="M120,70 V30 H1290 V382 H1250" fill="none" stroke="#333333" stroke-width="4"/>
  <text x="700" y="22" font-size="11" text-anchor="middle">4/0 AWG return to supply − (0 V, power ground)</text>

  <!-- H-bridge plate -->
  <rect x="320" y="60" width="480" height="370" fill="none" stroke="#1F497D" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="560" y="52" font-size="12" text-anchor="middle" fill="#1F497D" font-weight="bold">H-bridge plate (water-cooled): 4× IXFN420N10T, installed #2, 5, 6, 9</text>
  <rect x="340" y="84" width="440" height="12" fill="#E3A35A" stroke="#9C6A2A"/>
  <text x="560" y="78" font-size="11" text-anchor="middle" fill="#7A4E1C">RAIL BAR (+5 V)</text>
  <rect x="340" y="388" width="440" height="12" fill="#E3A35A" stroke="#9C6A2A"/>
  <text x="470" y="416" font-size="11" text-anchor="middle" fill="#7A4E1C">RETURN BAR</text>

  <!-- left column: Q1 (high), node A, Q3 (low) -->
  <path d="M400,96 V125 M400,175 V290 M400,340 V388" fill="none" stroke="#333333" stroke-width="3"/>
  <rect x="375" y="125" width="50" height="50" rx="4" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="147" font-size="13" text-anchor="middle" font-weight="bold">Q1</text>
  <text x="400" y="164" font-size="9" text-anchor="middle">POL</text>
  <rect x="375" y="290" width="50" height="50" rx="4" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="312" font-size="13" text-anchor="middle" font-weight="bold">Q3</text>
  <text x="400" y="329" font-size="9" text-anchor="middle">NOT-POL</text>
  <!-- right column: Q2 (high), node B, Q4 (low) -->
  <path d="M720,96 V125 M720,175 V290 M720,340 V388" fill="none" stroke="#333333" stroke-width="3"/>
  <rect x="695" y="125" width="50" height="50" rx="4" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="720" y="147" font-size="13" text-anchor="middle" font-weight="bold">Q2</text>
  <text x="720" y="164" font-size="9" text-anchor="middle">NOT-POL</text>
  <rect x="695" y="290" width="50" height="50" rx="4" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="720" y="312" font-size="13" text-anchor="middle" font-weight="bold">Q4</text>
  <text x="720" y="329" font-size="9" text-anchor="middle">POL</text>

  <!-- body diodes (anode at source, cathode at drain: conduct upward) -->
  <g stroke="#333333" stroke-width="1.3" fill="none">
    <path d="M400,110 H445 V138 M445,152 V190 H400"/>
    <path d="M400,275 H445 V303 M445,317 V355 H400"/>
    <path d="M720,110 H765 V138 M765,152 V190 H720"/>
    <path d="M720,275 H765 V303 M765,317 V355 H720"/>
  </g>
  <g fill="#333333" stroke="#333333" stroke-width="1.3">
    <polygon points="437,152 453,152 445,138"/><line x1="437" y1="138" x2="453" y2="138"/>
    <polygon points="437,317 453,317 445,303"/><line x1="437" y1="303" x2="453" y2="303"/>
    <polygon points="757,152 773,152 765,138"/><line x1="757" y1="138" x2="773" y2="138"/>
    <polygon points="757,317 773,317 765,303"/><line x1="757" y1="303" x2="773" y2="303"/>
  </g>

  <!-- nodes A, B and the coil string -->
  <circle cx="400" cy="240" r="4" fill="#333333"/>
  <circle cx="720" cy="240" r="4" fill="#333333"/>
  <text x="388" y="236" font-size="12" text-anchor="end" font-weight="bold">A</text>
  <text x="732" y="236" font-size="12" font-weight="bold">B</text>
  <path d="M400,240 H430 M510,240 H610 M690,240 H720" fill="none" stroke="#333333" stroke-width="3"/>
  <path d="M430,240 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" fill="none" stroke="#333333" stroke-width="2.5"/>
  <path d="M610,240 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0" fill="none" stroke="#333333" stroke-width="2.5"/>
  <text x="470" y="222" font-size="11" text-anchor="middle">coil 1</text>
  <text x="650" y="222" font-size="11" text-anchor="middle">coil 2</text>
  <!-- LEM on the mid lead -->
  <circle cx="560" cy="240" r="15" fill="none" stroke="#1F497D" stroke-width="2.5"/>
  <text x="560" y="210" font-size="10" text-anchor="middle" fill="#1F497D" font-weight="bold">LEM LF 310-S</text>
  <!-- varistors across each coil -->
  <g stroke="#333333" stroke-width="1.3" fill="none">
    <path d="M430,240 V270 H445 M495,270 H510 V240"/>
    <path d="M610,240 V270 H625 M675,270 H690 V240"/>
  </g>
  <rect x="445" y="262" width="50" height="16" fill="#FFFFFF" stroke="#333333"/>
  <text x="470" y="274" font-size="9" text-anchor="middle">S20K20</text>
  <rect x="625" y="262" width="50" height="16" fill="#FFFFFF" stroke="#333333"/>
  <text x="650" y="274" font-size="9" text-anchor="middle">S20K20</text>
  <text x="575" y="330" font-size="10">Forward: Q1 + Q4 on</text>
  <text x="575" y="346" font-size="10">Reverse: Q2 + Q3 on</text>

  <!-- return bar to pass-bank drain bar -->
  <path d="M780,394 H835 V110 H870" fill="none" stroke="#333333" stroke-width="4"/>
  <text x="826" y="250" font-size="11" text-anchor="middle" transform="rotate(-90 826 250)">4/0 AWG</text>

  <!-- pass-bank plate -->
  <rect x="850" y="60" width="430" height="370" fill="none" stroke="#1F497D" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="1065" y="52" font-size="12" text-anchor="middle" fill="#1F497D" font-weight="bold">Pass-bank plate (water-cooled), LOW-SIDE</text>
  <rect x="870" y="104" width="380" height="12" fill="#E3A35A" stroke="#9C6A2A"/>
  <text x="1060" y="98" font-size="11" text-anchor="middle" fill="#7A4E1C">DRAIN BAR ("input → drain")</text>
  <rect x="870" y="376" width="380" height="12" fill="#E3A35A" stroke="#9C6A2A"/>
  <text x="1040" y="404" font-size="11" text-anchor="middle" fill="#7A4E1C">SOURCE BAR ("output → to source") = supply 0 V</text>

  <!-- gate bus -->
  <path d="M862,145 H1100" fill="none" stroke="#1F497D" stroke-width="1.5"/>
  <!-- three of the six legs -->
  <g id="leg">
    <path d="M940,116 V170 M940,220 V250 M940,290 V376" fill="none" stroke="#333333" stroke-width="2"/>
    <rect x="915" y="170" width="50" height="50" rx="4" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
    <text x="940" y="192" font-size="10" text-anchor="middle" font-weight="bold">IXTN</text>
    <text x="940" y="205" font-size="9" text-anchor="middle">200N10L2</text>
    <rect x="928" y="250" width="24" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
    <path d="M895,145 V170 M895,190 V205 M895,225 V235 H940" fill="none" stroke="#1F497D" stroke-width="1.2"/>
    <path d="M895,195 H915" fill="none" stroke="#1F497D" stroke-width="1.2"/>
    <rect x="889" y="170" width="12" height="20" fill="#FFFFFF" stroke="#1F497D"/>
    <rect x="889" y="205" width="12" height="20" fill="#FFFFFF" stroke="#1F497D"/>
    <circle cx="940" cy="235" r="2.5" fill="#333333"/>
    <path d="M940,160 H975 V188 M975,202 V235 H940" fill="none" stroke="#333333" stroke-width="1.2"/>
    <polygon points="967,202 983,202 975,188" fill="#333333"/>
    <line x1="967" y1="188" x2="983" y2="188" stroke="#333333" stroke-width="1.3"/>
  </g>
  <use href="#leg" x="100"/>
  <use href="#leg" x="200"/>
  <text x="1194" y="235" font-size="16" text-anchor="middle">…</text>
  <text x="1194" y="255" font-size="10" text-anchor="middle">6 legs</text>
  <text x="1194" y="268" font-size="9" text-anchor="middle">(3 drawn)</text>
  <!-- leg labels on the first leg -->
  <text x="886" y="184" font-size="9" text-anchor="end" fill="#1F497D">R1</text>
  <text x="886" y="219" font-size="9" text-anchor="end" fill="#1F497D">R4</text>
  <text x="956" y="268" font-size="9">R2</text>
  <!-- TVS across the bank -->
  <path d="M1235,116 V220 M1235,280 V376" fill="none" stroke="#333333" stroke-width="2"/>
  <rect x="1222" y="220" width="26" height="60" fill="#FBE4E4" stroke="#C00000" stroke-width="1.5"/>
  <text x="1235" y="254" font-size="10" text-anchor="middle" fill="#C00000" font-weight="bold">TVS</text>
  <text x="1065" y="425" font-size="9" text-anchor="middle">R1 24.9 Ω · R4 47 kΩ · R2 MP930 0.03 Ω · TVS 5KP12CA · FETs #1, 2, 4, 7, 9, 10</text>

  <!-- ===================== CONTROL SIDE ===================== -->
  <!-- gate drivers -->
  <rect x="330" y="450" width="200" height="70" fill="#DDEBF7" stroke="#1F497D" stroke-width="1.5"/>
  <text x="430" y="468" font-size="11" text-anchor="middle" fill="#1F497D" font-weight="bold">4× UCC5350 isolated drivers</text>
  <text x="430" y="482" font-size="9" text-anchor="middle">+ 4× RO-0515S 15 V, each floating</text>
  <text x="430" y="494" font-size="9" text-anchor="middle">on its own MOSFET's source</text>
  <text x="430" y="508" font-size="9" text-anchor="middle">10 Ω on / 4.7 Ω off, 10 kΩ G–S</text>
  <path d="M430,450 V434" fill="none" stroke="#1F497D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="440" y="444" font-size="9" fill="#1F497D">to Q1–Q4 gates</text>

  <!-- sensing chain -->
  <path d="M560,255 V440" fill="none" stroke="#1F497D" stroke-width="1.5"/>
  <text x="566" y="370" font-size="9" fill="#1F497D">0.5 mA/A</text>
  <rect x="535" y="440" width="50" height="24" fill="#FFFFFF" stroke="#1F497D" stroke-width="1.5"/>
  <text x="560" y="456" font-size="10" text-anchor="middle">10 Ω</text>
  <text x="560" y="478" font-size="9" text-anchor="middle">burden</text>
  <path d="M585,452 H605" fill="none" stroke="#1F497D" stroke-width="1.5"/>
  <polygon points="605,432 605,472 650,452" fill="#DDEBF7" stroke="#1F497D" stroke-width="1.5"/>
  <text x="627" y="490" font-size="9" text-anchor="middle">AD8421 (G = 1)</text>
  <path d="M650,452 H690 V776" fill="none" stroke="#1F497D" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- op-amp stage -->
  <path d="M970,500 H1000 V440 H862 V145" fill="none" stroke="#1F497D" stroke-width="1.5"/>
  <polygon points="900,470 900,530 970,500" fill="#DDEBF7" stroke="#1F497D" stroke-width="1.5"/>
  <text x="910" y="489" font-size="12">+</text>
  <text x="910" y="520" font-size="12">−</text>
  <text x="935" y="465" font-size="10" text-anchor="middle" fill="#1F497D" font-weight="bold">OPA994, gain ≈ 8</text>
  <path d="M985,500 V550 H962 M922,550 H890 V515 H900" fill="none" stroke="#1F497D" stroke-width="1.2"/>
  <rect x="922" y="543" width="40" height="14" fill="#FFFFFF" stroke="#1F497D"/>
  <text x="942" y="573" font-size="9" text-anchor="middle">R_f 6.98 kΩ</text>
  <path d="M890,550 V565 M890,585 V598" fill="none" stroke="#1F497D" stroke-width="1.2"/>
  <rect x="884" y="565" width="12" height="20" fill="#FFFFFF" stroke="#1F497D"/>
  <path d="M880,598 H900 M884,603 H896 M888,608 H892" stroke="#333333" stroke-width="1.5"/>
  <text x="900" y="596" font-size="9">R_g 1 kΩ</text>
  <text x="890" y="622" font-size="9" text-anchor="middle">supply 0 V</text>
  <path d="M870,776 V485 H900" fill="none" stroke="#1F497D" stroke-width="1.5"/>
  <text x="876" y="700" font-size="9">0…1 V</text>
  <text x="876" y="712" font-size="9">(50 Ω term. TBD)</text>
  <text x="1006" y="472" font-size="9">0…8 V gate cmd</text>

  <!-- logic board -->
  <rect x="330" y="560" width="320" height="190" fill="#F7F7F7" stroke="#1F497D" stroke-width="1.5"/>
  <text x="490" y="578" font-size="12" text-anchor="middle" fill="#1F497D" font-weight="bold">Breakout / safety logic board (3.3 V)</text>
  <rect x="340" y="594" width="140" height="34" fill="#FFFFFF" stroke="#666666"/>
  <text x="410" y="608" font-size="10" text-anchor="middle" font-weight="bold">74HC04 #1</text>
  <text x="410" y="621" font-size="9" text-anchor="middle">POL → NOT-POL</text>
  <rect x="490" y="594" width="150" height="34" fill="#FFFFFF" stroke="#666666"/>
  <text x="565" y="608" font-size="10" text-anchor="middle" font-weight="bold">74HC10 3-in NAND</text>
  <text x="565" y="621" font-size="9" text-anchor="middle">EN · HB-OK · latch-OK → DISABLE</text>
  <rect x="340" y="636" width="140" height="42" fill="#FFFFFF" stroke="#666666"/>
  <text x="410" y="650" font-size="10" text-anchor="middle" font-weight="bold">CD74HC123</text>
  <text x="410" y="662" font-size="9" text-anchor="middle">monostable, 220 kΩ / 100 nF</text>
  <text x="410" y="673" font-size="9" text-anchor="middle">drops ≈ 7.6 ms after HB stops</text>
  <rect x="490" y="636" width="150" height="42" fill="#FFFFFF" stroke="#666666"/>
  <text x="565" y="650" font-size="10" text-anchor="middle" font-weight="bold">74HC74 latch</text>
  <text x="565" y="662" font-size="9" text-anchor="middle">trips on HB loss, manual reset</text>
  <text x="565" y="673" font-size="9" text-anchor="middle">(B3F button); powers up tripped</text>
  <rect x="340" y="686" width="300" height="30" fill="#FFFFFF" stroke="#666666"/>
  <text x="490" y="699" font-size="10" text-anchor="middle" font-weight="bold">74HC04 #2 → status LEDs</text>
  <text x="490" y="711" font-size="9" text-anchor="middle">green ALIVE · amber BRIDGE EN · red FAULT (latched)</text>
  <text x="490" y="740" font-size="9" text-anchor="middle">every E1 input has a 10 kΩ pull-down</text>
  <!-- logic board to drivers -->
  <path d="M370,560 V524" fill="none" stroke="#1F497D" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <path d="M430,560 V524" fill="none" stroke="#1F497D" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <path d="M500,560 V524" fill="none" stroke="#1F497D" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="374" y="545" font-size="8">POL</text>
  <text x="434" y="545" font-size="8">NOT-POL</text>
  <text x="504" y="545" font-size="8">DISABLE</text>

  <!-- Red Pitaya -->
  <rect x="330" y="780" width="670" height="110" fill="#DDEBF7" stroke="#1F497D" stroke-width="2"/>
  <text x="665" y="848" font-size="15" text-anchor="middle" fill="#1F497D" font-weight="bold">Red Pitaya STEMlab 125-14 — coil servo (MOT board, 192.168.0.65)</text>
  <text x="665" y="868" font-size="11" text-anchor="middle">PI loop @ 976.6 kS/s · flip state machine · OUT1 command clamp · heartbeat 954 Hz</text>
  <g font-size="9" text-anchor="middle">
    <text x="345" y="797" font-weight="bold">IN2</text>
    <text x="390" y="797" font-weight="bold">3</text><text x="390" y="808">POL</text>
    <text x="425" y="797" font-weight="bold">5</text><text x="425" y="808">EN</text>
    <text x="460" y="797" font-weight="bold">15</text><text x="460" y="808">HB</text>
    <text x="510" y="797" fill="#888888">7</text><text x="510" y="808" fill="#888888">unused</text>
    <text x="560" y="797" fill="#888888">13</text><text x="560" y="808" fill="#888888">n.c.</text>
    <text x="690" y="797" font-weight="bold">IN1</text>
    <text x="870" y="797" font-weight="bold">OUT1</text>
    <text x="950" y="797" fill="#888888">OUT2</text><text x="950" y="808" fill="#888888">unused, 0 V</text>
  </g>
  <path d="M390,780 V750 M425,780 V750 M460,780 V750" fill="none" stroke="#1F497D" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- control computer -->
  <rect x="40" y="780" width="250" height="110" fill="#EAEAEA" stroke="#666666" stroke-width="1.5"/>
  <text x="165" y="804" font-size="13" text-anchor="middle" font-weight="bold" fill="#333333">control computer</text>
  <text x="165" y="822" font-size="10" text-anchor="middle">signed setpoint, ±10 V analog out</text>
  <text x="165" y="850" font-size="10" text-anchor="middle">flip pulse ≥ 1 µs → E1 pin 9</text>
  <text x="165" y="872" font-size="10" text-anchor="middle">arm level → E1 pin 11</text>
  <rect x="190" y="726" width="90" height="34" fill="#FFFFFF" stroke="#1F497D" stroke-width="1.2"/>
  <text x="235" y="741" font-size="10" text-anchor="middle">÷10 divider</text>
  <text x="235" y="753" font-size="8" text-anchor="middle">20 A per computer volt</text>
  <path d="M150,780 V743 H190 M280,743 H310 V768 H345 V776" fill="none" stroke="#1F497D" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M290,846 H326 M290,868 H326" fill="none" stroke="#1F497D" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="338" y="828" font-size="8">9 flip</text>
  <text x="338" y="884" font-size="8">11 arm</text>

  <!-- lab PC -->
  <rect x="1060" y="800" width="210" height="70" fill="#EAEAEA" stroke="#666666" stroke-width="1.5"/>
  <text x="1165" y="824" font-size="12" text-anchor="middle" font-weight="bold" fill="#333333">lab PC (host tools)</text>
  <text x="1165" y="842" font-size="10" text-anchor="middle">deploy · check · watch · step · sweep</text>
  <text x="1165" y="858" font-size="9" text-anchor="middle">config + diagnostics only</text>
  <path d="M1000,835 H1060" fill="none" stroke="#666666" stroke-width="2"/>
  <text x="1030" y="828" font-size="9" text-anchor="middle">Ethernet</text>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="11">
    <line x1="40" y1="925" x2="85" y2="925" stroke="#333333" stroke-width="4"/>
    <text x="92" y="929">100 A path (4/0 cable)</text>
    <rect x="240" y="919" width="40" height="12" fill="#E3A35A" stroke="#9C6A2A"/>
    <text x="287" y="929">copper bus bar</text>
    <line x1="390" y1="925" x2="435" y2="925" stroke="#1F497D" stroke-width="1.5"/>
    <text x="442" y="929">analog signal</text>
    <line x1="540" y1="925" x2="585" y2="925" stroke="#1F497D" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="592" y="929">3.3 V logic</text>
    <polygon points="692,931 708,931 700,917" fill="#333333"/>
    <text x="715" y="929">MOSFET body diode (built in)</text>
    <circle cx="905" cy="925" r="3.5" fill="#333333"/>
    <text x="914" y="929">joined; crossings without a dot are not connected</text>
  </g>
  <text x="40" y="955" font-size="10" fill="#555555">Not shown: LEM ±15 V supply, AD8421 / OPA994 / logic-board supply rails (not yet documented); AIN0/AIN1/AOUT0 (unused in the MVP); DIO5 fault input (not wired in the MVP).</text>
  <text x="40" y="971" font-size="10" fill="#555555">Gate drive: Q1 and Q4 follow POL, Q2 and Q3 follow NOT-POL; DISABLE (active high) goes to all four drivers' IN− and opens the whole bridge. No dead time on the logic board — the flip state machine's enable-low window provides it.</text>
  <text x="40" y="987" font-size="10" fill="#555555">MOT channel only (MVP). Coils: 16 µH / 6.4 mΩ pair, 0.524 G/cm/A. Both FET plates water-cooled; first test round runs without water.</text>
</svg>
